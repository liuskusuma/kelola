<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kelola</title>
  <meta name="description" content="Kelola: hitung harga jual, catat penjualan, dan pantau laba usaha Anda.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kelola">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #f6f7f5;
      --card: #ffffff;
      --text: #1c2321;
      --muted: #5f6b67;
      --line: #dfe4e1;
      --brand: #0f766e;
      --brand-soft: #e3f3f1;
      --on-brand: #ffffff;
      --danger: #b42318;
      --warn: #b54708;
      --ok: #067647;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111615;
        --card: #1a2120;
        --text: #e8eeec;
        --muted: #9aa8a4;
        --line: #2c3634;
        --brand: #2dd4bf;
        --brand-soft: #173431;
        --on-brand: #06201d;
        --danger: #f97066;
        --warn: #fdb022;
        --ok: #47cd89;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-bottom: calc(72px + env(safe-area-inset-bottom));
    }
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 20px; margin: 0; }
    header .usaha { font-size: 13px; color: var(--muted); }
    .badge {
      font-size: 12px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
      background: var(--card); cursor: pointer;
    }
    .badge.ok { color: var(--ok); }
    .badge.warn { color: var(--warn); }
    .badge.err { color: var(--danger); }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--card); border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      border: 0; background: none; color: var(--muted);
      padding: 10px 4px 12px; font: inherit; font-size: 13px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    nav button svg { width: 22px; height: 22px; }
    nav button[aria-current="page"] { color: var(--brand); font-weight: 600; }
    h2 { font-size: 18px; margin: 4px 0 12px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
    }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack > * + * { margin-top: 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .tile {
      text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: var(--radius); padding: 12px; font: inherit; cursor: pointer; min-height: 84px;
    }
    .tile:active { background: var(--brand-soft); }
    .tile .nama { font-weight: 600; overflow-wrap: anywhere; }
    .tile[disabled] { opacity: .5; cursor: not-allowed; }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .stat .label { font-size: 13px; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 700; margin-top: 2px; overflow-wrap: anywhere; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { padding: 10px 0; border-top: 1px solid var(--line); }
    .list li:first-child { border-top: 0; }
    button.btn, a.btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer;
      text-decoration: none;
    }
    button.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    button.btn.danger { color: var(--danger); }
    button.btn.block { width: 100%; }
    button.btn:disabled { opacity: .5; cursor: not-allowed; }
    button.link { border: 0; background: none; color: var(--brand); font: inherit; padding: 0; cursor: pointer; }
    .qty { display: inline-flex; align-items: center; gap: 8px; }
    .qty button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 18px; cursor: pointer; }
    label.field { display: block; }
    label.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    }
    input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hint { background: var(--brand-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
    .total { font-size: 24px; font-weight: 700; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .seg button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
    .msg { font-size: 14px; padding: 8px 10px; border-radius: 8px; }
    .msg.err { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .msg.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
    dialog {
      width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 48px);
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card); color: var(--text); padding: 16px;
    }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    #toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Kelola</h1>
      <div class="usaha" id="namaUsaha"></div>
    </div>
    <button class="badge" id="syncBadge" type="button" data-go="akun">Hanya di perangkat ini</button>
  </header>

  <main id="view"></main>

  <nav aria-label="Menu utama">
    <button type="button" data-go="kasir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h4M7 17h2"/></svg>
      Kasir
    </button>
    <button type="button" data-go="produk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
      Produk
    </button>
    <button type="button" data-go="laporan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Laporan
    </button>
    <button type="button" data-go="akun">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      Akun
    </button>
  </nav>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/supabase-2.45.4.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
