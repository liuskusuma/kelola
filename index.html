<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kelola</title>
  <meta name="description" content="Kelola: hitung harga jual, catat penjualan, dan pantau laba usaha Anda.">
  <meta name="theme-color" content="#f2f5fa">
  <script>
    // Pasang tema sebelum halaman tampil, supaya tidak berkedip biru saat dibuka.
    try { document.documentElement.dataset.tema = JSON.parse(localStorage.getItem('kelola:pengaturan') || '{}').tema || 'terang'; }
    catch (e) { document.documentElement.dataset.tema = 'terang'; }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kelola">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <style>
    /* Huruf judul Exo 2 (sama seperti Bagi Rata), disimpan lokal supaya tetap tampil saat offline. */
    @font-face { font-family: "Exo 2"; font-style: normal; font-weight: 700; font-display: swap; src: url(vendor/fonts/exo-2-latin-700-normal.woff2) format("woff2"); }
    @font-face { font-family: "Exo 2"; font-style: italic; font-weight: 700; font-display: swap; src: url(vendor/fonts/exo-2-latin-700-italic.woff2) format("woff2"); }
    @font-face { font-family: "Exo 2"; font-style: normal; font-weight: 800; font-display: swap; src: url(vendor/fonts/exo-2-latin-800-normal.woff2) format("woff2"); }
    @font-face { font-family: "Exo 2"; font-style: italic; font-weight: 800; font-display: swap; src: url(vendor/fonts/exo-2-latin-800-italic.woff2) format("woff2"); }
    /* Gaya soft UI dari Bagi Rata: kartu terlihat menonjol, kotak isian tertekan ke dalam.
       Warna dominan putih dengan navy dan kuning dari logo Kelola. */
    :root {
      --navy: #0a2a6e;
      --yellow: #fecb10;
      --bg: #f2f5fa;
      --cell: #f2f5fa;
      --well: #e9eef6;
      --raise-l: #ffffff;
      --raise-d: #d2d9e6;
      --fg: #13203f;
      --muted: #5d6a88;
      --faint: #8b96b0;
      --sep: rgba(10, 42, 110, .08);
      --primary: var(--navy);
      --on-primary: #ffffff;
      --accent-text: var(--navy);
      --ok: #12805c;
      --warn: #a65d00;
      --danger: #c8372d;
      --grafik-1: #3159c8;
      --grafik-2: #d99a00;
      --f: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
      --f-display: "Exo 2", Bahnschrift, "Segoe UI", system-ui, sans-serif;
      --raised: 9px 9px 20px var(--raise-d), -9px -9px 20px var(--raise-l);
      --raised-sm: 3px 3px 7px var(--raise-d), -3px -3px 7px var(--raise-l);
      --inset: inset 5px 5px 11px var(--raise-d), inset -5px -5px 11px var(--raise-l);
      --inset-sm: inset 3px 3px 7px var(--raise-d), inset -3px -3px 7px var(--raise-l);
      color-scheme: light;
    }
    /* Mode gelap: navy seperti tema Default Bagi Rata. Bawaannya terang;
       gelap hanya kalau dipilih di Akun, atau "Ikuti HP" dan HP-nya mode gelap. */
    :root[data-tema="gelap"] {
      --bg: #14234f;
      --cell: #14234f;
      --well: #101d44;
      --raise-l: #1c3066;
      --raise-d: #0b1534;
      --fg: #f5f7fc;
      --muted: #a3b0d6;
      --faint: #7f8db8;
      --sep: rgba(255, 255, 255, .08);
      --primary: var(--yellow);
      --on-primary: #0a1a45;
      --accent-text: var(--yellow);
      --ok: #5fd6a4;
      --warn: #fbc02d;
      --danger: #ff8a7a;
      --grafik-1: #6385ec;
      --grafik-2: #b08200;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-tema="otomatis"] {
        --bg: #14234f;
        --cell: #14234f;
        --well: #101d44;
        --raise-l: #1c3066;
        --raise-d: #0b1534;
        --fg: #f5f7fc;
        --muted: #a3b0d6;
        --faint: #7f8db8;
        --sep: rgba(255, 255, 255, .08);
        --primary: var(--yellow);
        --on-primary: #0a1a45;
        --accent-text: var(--yellow);
        --ok: #5fd6a4;
        --warn: #fbc02d;
        --danger: #ff8a7a;
        --grafik-1: #6385ec;
        --grafik-2: #b08200;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.45 var(--f);
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }
    body.ada-ringkasan { padding-bottom: calc(160px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; }

    /* Header */
    header.nav {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 14px;
      padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
      background: var(--bg);
    }
    header.nav .logo { width: 48px; height: 48px; border-radius: 12px; object-fit: contain; background: #fff; box-shadow: var(--raised-sm); flex: 0 0 auto; }
    header.nav .titles { flex: 1 1 auto; min-width: 0; }
    header.nav h1 {
      font-family: var(--f-display); font-style: italic; font-weight: 800;
      font-size: 30px; line-height: 1; letter-spacing: -.01em; margin: 0; color: var(--accent-text);
    }
    header.nav p { margin: 4px 0 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sync {
      display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
      border: 0; border-radius: 999px; padding: 8px 12px; cursor: pointer;
      background: var(--cell); box-shadow: var(--raised-sm);
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
    .sync.ok .dot { background: var(--ok); }
    .sync.warn .dot { background: var(--warn); }
    .sync.err .dot { background: var(--danger); }
    .sync.err { color: var(--danger); }
    .sync.busy .dot { background: var(--yellow); animation: denyut 1s ease-in-out infinite; }
    @keyframes denyut { 50% { opacity: .3; } }

    main { max-width: 720px; margin: 0 auto; padding: 0 20px 24px; }

    /* Judul bagian dan kartu */
    .group-title {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-family: var(--f-display); font-weight: 700; font-size: 13px;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      margin: 26px 8px 10px;
    }
    .group-title:first-child { margin-top: 10px; }
    .card {
      background: var(--cell); border-radius: 28px; box-shadow: var(--raised);
      padding: 16px 18px; margin-bottom: 8px;
    }
    .foot { font-size: 13px; color: var(--muted); margin: 10px 8px 0; line-height: 1.4; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stack > * + * { margin-top: 12px; }
    .label { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .3px; }
    .angka { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; }

    /* Ubin produk di kasir */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .tile {
      text-align: left; border: 0; background: var(--cell); color: var(--fg);
      border-radius: 22px; padding: 14px 16px; cursor: pointer; min-height: 92px;
      box-shadow: var(--raised); transition: box-shadow .12s;
    }
    .tile:active { box-shadow: var(--inset-sm); }
    .tile .nama { font-family: var(--f-display); font-weight: 700; font-size: 16px; overflow-wrap: anywhere; padding-right: 22px; }
    .tile .harga { font-family: var(--f-display); font-weight: 800; color: var(--accent-text); margin-top: 4px; }
    .tile { position: relative; display: flex; flex-direction: column; justify-content: flex-start; }
    .tile .jumlah {
      position: absolute; top: 10px; right: 10px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px;
      background: var(--yellow); color: #0a1a45; font-size: 13px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .tile[disabled] { opacity: .45; cursor: not-allowed; box-shadow: var(--inset-sm); }

    /* Statistik */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stat { background: var(--cell); border-radius: 22px; padding: 14px 16px; box-shadow: var(--raised); min-width: 0; }
    .stat .lbl { font-size: 13px; color: var(--muted); }
    .stat .value { font-family: var(--f-display); font-weight: 800; font-size: 21px; margin-top: 2px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    .stat.utama { background: var(--navy); box-shadow: var(--raised); }
    .stat.utama .lbl { color: #c6d1ee; }
    .stat.utama .value { color: var(--yellow); }

    /* Daftar */
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { padding: 12px 0; position: relative; }
    .list li + li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; border-top: 1px solid var(--sep); }
    .list .nama { font-family: var(--f-display); font-weight: 700; }

    /* Tombol */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 0; border-radius: 30px; padding: 11px 18px; cursor: pointer;
      background: var(--cell); color: var(--fg); box-shadow: var(--raised-sm);
      font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .2px;
      text-decoration: none;
    }
    .btn:active { box-shadow: var(--inset-sm); }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.danger { color: var(--danger); }
    .btn.block { width: 100%; }
    .btn.kecil { padding: 7px 14px; font-size: 14px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .link { border: 0; background: none; color: var(--accent-text); padding: 0; cursor: pointer; font-weight: 600; }
    .tambah { font-family: var(--f-display); font-weight: 700; font-size: 15px; text-transform: none; letter-spacing: 0; }

    /* Stepper jumlah */
    .qty { display: inline-flex; align-items: center; gap: 4px; background: var(--well); box-shadow: var(--inset-sm); border-radius: 999px; padding: 4px; }
    .qty button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; color: var(--accent-text); font-size: 20px; font-weight: 700; cursor: pointer; }
    .qty span { min-width: 22px; text-align: center; font-weight: 700; }

    /* Isian */
    label.field { display: block; }
    label.field > span, .field > .lbl { display: block; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .3px; margin: 0 4px 6px; }
    input, select {
      width: 100%; font: inherit; font-size: 16px; color: var(--fg);
      background: var(--well); border: 0; border-radius: 16px; padding: 11px 14px;
      box-shadow: var(--inset-sm); outline: none;
    }
    input::placeholder { color: var(--faint); }
    input[type="date"] { min-width: 0; -webkit-appearance: none; appearance: none; padding: 11px 10px; font-size: 15px; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }
    input:focus-visible, select:focus-visible { box-shadow: var(--inset-sm), 0 0 0 2px var(--primary); }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .hint { background: var(--well); box-shadow: var(--inset-sm); border-radius: 20px; padding: 14px 16px; font-size: 14px; }
    .total { font-family: var(--f-display); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }

    /* Pilihan periode */
    .seg { display: flex; gap: 4px; background: var(--well); box-shadow: var(--inset-sm); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
    .seg button { flex: 1; border: 0; background: none; color: var(--muted); border-radius: 999px; padding: 8px 6px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); box-shadow: var(--raised-sm); font-weight: 700; }
    .seg.periode button { padding: 8px 2px; font-size: 13px; }
    details.lipat > summary { cursor: pointer; list-style: none; }
    details.lipat > summary::-webkit-details-marker { display: none; }
    details.lipat > summary::after { content: '›'; font-size: 20px; line-height: 1; transform: rotate(90deg); transition: transform .15s; }
    details.lipat[open] > summary::after { transform: rotate(-90deg); }
    .pesan-wa { white-space: pre-wrap; font: inherit; font-size: 14px; background: var(--well); box-shadow: var(--inset-sm); border-radius: 16px; padding: 12px 14px; margin: 0; max-height: 40vh; overflow: auto; }
    .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
    .swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--cell); box-shadow: var(--raised-sm); cursor: pointer; padding: 0; }
    .swatch.bawaan { background: linear-gradient(135deg, #0a2a6e 50%, #fecb10 50%); }
    .swatch[aria-pressed="true"] { outline: 3px solid var(--fg); outline-offset: 2px; }
    .logo-pratinjau { width: 64px; height: 64px; border-radius: 14px; object-fit: contain; background: #fff; box-shadow: var(--raised-sm); flex: 0 0 auto; }
    .grafik { padding-top: 14px; }
    .grafik .legenda { display: flex; gap: 16px; color: var(--muted); margin: 0 0 6px 4px; }
    .grafik i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    #view.geser-kiri { animation: geser-kiri .22s ease-out; }
    #view.geser-kanan { animation: geser-kanan .22s ease-out; }
    @keyframes geser-kiri { from { transform: translateX(28px); opacity: .4; } }
    @keyframes geser-kanan { from { transform: translateX(-28px); opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { #view.geser-kiri, #view.geser-kanan { animation: none; } }
    .kirim-laporan { margin: -6px 0 18px; gap: 10px; flex-wrap: wrap; }
    .kirim-laporan .btn { flex: 0 0 auto; white-space: nowrap; }
    .isi-file { margin: 0; padding-left: 18px; }
    .grafik i.omzet, .grafik path.omzet { background: var(--grafik-1); fill: var(--grafik-1); }
    .grafik i.laba, .grafik path.laba { background: var(--grafik-2); fill: var(--grafik-2); }
    .grafik .kanvas { position: relative; }
    .grafik svg { display: block; width: 100%; height: auto; overflow: visible; }
    .grafik svg text { font-size: 10px; fill: var(--faint); font-variant-numeric: tabular-nums; }
    .grafik svg line.grid { stroke: var(--sep); stroke-width: 1; }
    .grafik svg line.dasar { stroke: var(--faint); stroke-width: 1; opacity: .5; }
    .grafik .sentuh { fill: transparent; cursor: pointer; }
    .grafik .sentuh.aktif { fill: var(--fg); opacity: .06; }
    .grafik .tip { position: absolute; top: -6px; transform: translateY(-100%); background: var(--cell); color: var(--fg); box-shadow: var(--raised-sm); border-radius: 12px; padding: 8px 10px; font-size: 13px; line-height: 1.5; pointer-events: none; white-space: nowrap; z-index: 2; }
    .grafik .tip .muted { color: var(--muted); }
    .tabel-grafik { margin-top: 8px; }
    .tabel-grafik summary { cursor: pointer; color: var(--accent-text); font-weight: 600; }
    .tabel-grafik table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
    .tabel-grafik th, .tabel-grafik td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--sep); }
    .tabel-grafik th:first-child, .tabel-grafik td:first-child { text-align: left; }
    .tabel-grafik th { color: var(--muted); font-weight: 600; }
    .qris-gambar { display: block; width: 100%; max-width: 260px; margin: 0 auto; border-radius: 14px; background: #fff; }
    .qris-gambar.besar { max-width: 420px; }

    .empty { text-align: center; color: var(--muted); padding: 20px 8px; }
    .msg { font-size: 14px; padding: 10px 14px; border-radius: 16px; }
    .msg.err { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
    .msg.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }

    /* Ringkasan keranjang di atas tab bar */
    #summary {
      position: fixed; z-index: 5; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom));
      max-width: 688px; margin: 0 auto;
      display: none; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--navy); color: #fff; border-radius: 28px; padding: 14px 20px;
      box-shadow: 0 10px 24px rgba(10, 30, 80, .28); border: 0; cursor: pointer; text-align: left;
    }
    body.ada-ringkasan #summary { display: flex; }
    #summary b { font-family: var(--f-display); font-size: 20px; font-weight: 800; color: var(--yellow); font-variant-numeric: tabular-nums; }

    /* Tab bar */
    nav.tabs {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--cell); box-shadow: 0 -6px 16px rgba(20, 40, 90, .08);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    }
    nav.tabs button {
      border: 0; background: none; color: var(--muted); cursor: pointer;
      display: grid; justify-items: center; gap: 2px; padding: 4px 0;
      font-size: 11px; font-weight: 600;
    }
    nav.tabs .ikon { display: grid; place-items: center; width: 52px; height: 32px; border-radius: 999px; }
    nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    nav.tabs button[aria-current="page"] { color: var(--accent-text); font-weight: 800; }
    nav.tabs button[aria-current="page"] .ikon { background: var(--navy); color: var(--yellow); box-shadow: var(--raised-sm); }

    dialog {
      width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 48px);
      border: 0; border-radius: 28px; background: var(--cell); color: var(--fg); padding: 20px;
      box-shadow: 0 20px 50px rgba(10, 30, 80, .3);
    }
    dialog::backdrop { background: rgb(10 20 50 / .35); }
    dialog h3 { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 22px; margin: 0; color: var(--accent-text); }
    #toast {
      position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px); z-index: 10;
      box-shadow: 0 8px 20px rgba(10, 30, 80, .3);
    }
    #toast.show { opacity: 1; }
    code { font-size: 13px; }

    /* Resep, paket, dan saran harga */
    .warn { color: var(--warn); }
    .err { color: var(--danger); }
    .ok { color: var(--ok); }
    .tag {
      display: inline-block; vertical-align: 2px; margin-left: 4px; padding: 1px 8px; border-radius: 999px;
      background: var(--well); box-shadow: var(--inset-sm); color: var(--muted);
      font-family: var(--f); font-size: 11px; font-weight: 700; letter-spacing: .3px;
    }
    .aksi { display: flex; gap: 8px; flex: 0 0 auto; }
    /* Penjualan bayar nanti yang belum lunas di riwayat */
    .list .row.belum { background: color-mix(in srgb, var(--warn) 12%, transparent); border-radius: 16px; padding-left: 12px; padding-right: 12px; margin: 4px -8px; }
    .list li.belum::before, .list li.belum + li::before { display: none; }
    .tanda-belum { margin-top: 6px; color: var(--fg); overflow-wrap: anywhere; }
    .label-belum {
      display: table; margin-bottom: 4px; padding: 2px 8px; border-radius: 999px;
      background: var(--warn); color: var(--bg); font-size: 11px; font-weight: 800; letter-spacing: .4px; text-transform: uppercase;
    }
    .peringatan { border-left: 6px solid var(--tanda, var(--yellow)); margin-top: 14px; }
    .baris { display: grid; grid-template-columns: minmax(0, 1fr) 68px 34px 32px; gap: 8px; align-items: center; }
    .baris + .baris { margin-top: 8px; }
    .baris .hapus {
      width: 36px; height: 36px; border: 0; border-radius: 50%; cursor: pointer;
      background: var(--cell); box-shadow: var(--raised-sm); color: var(--danger); font-size: 20px; font-weight: 700;
    }
    .seg.kecil { margin-bottom: 0; }
    .field.sempit { width: 110px; }
    .baris .unit { overflow: hidden; text-overflow: ellipsis; }
    .baris select, .baris input { padding: 10px 10px; }
    .baris .hapus { width: 32px; height: 32px; }
    .field.sempit > span { margin-bottom: 4px; }
    .pilihan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pilih {
      display: grid; gap: 2px; text-align: center; border: 0; border-radius: 18px; padding: 10px 6px; cursor: pointer;
      background: var(--cell); color: var(--fg); box-shadow: var(--raised-sm);
    }
    .pilih b { font-family: var(--f-display); font-weight: 800; font-size: 16px; color: var(--accent-text); font-variant-numeric: tabular-nums; }
